name: Fork release

# Свой конвейер обновлений форка. Пуш тега v* собирает приложение на всех
# платформах и публикует релиз с ассетами и latest.json — фидом
# самообновления (internal/update: Feed, AppAsset, BinaryAsset, sameSigner):
# приложение с env
#   MAGPIE_UPDATE_FEED=https://github.com/TransmuteLabs/magpie/releases/latest/download/latest.json
# читает его, качает ассет своей платформы из того же релиза, сверяет
# SHA-256 и меняет себя.
# macOS-приложение должно быть сборкой этого же конвейера (первая установка
# вручную): sameSigner пускает только ту же подпись, ad-hoc -> ad-hoc.
# workflow_dispatch собирает без релиза (артефакты рана), для ручной
# установки и проверки.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label for the build (e.g. 0.1.4000); empty: 0.0.0-<sha>'
        required: false
        default: ''

permissions:
  contents: write

# версия сборки: из тега (v0.1.4000 -> 0.1.4000), из input ручного запуска
# или 0.0.0-<sha> для ручного без input
env:
  BUILD_VERSION: ${{ github.event.inputs.version || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}

jobs:
  app:
    # arm64-раннер: GUI линкует webview платформы нативно (cgo), кросс-сборки нет
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build the app
        run: make app VERSION="${BUILD_VERSION:-0.0.0-${GITHUB_SHA::7}}"

      - name: Sign ad-hoc
        run: |
          codesign --force --deep -s - magpie.app
          codesign --verify --deep --strict magpie.app

      - name: Pack
        run: |
          mkdir -p dist
          ditto -c -k --keepParent magpie.app dist/magpie-darwin-arm64.zip

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: magpie-darwin-arm64
          path: dist/*
          if-no-files-found: error

  windows:
    # пока выключено: one word убрать if — и джоба вернётся
    if: false
    # WebView2 без cgo: обе архитектуры кросс-компилятся (Makefile,
    # release-windows: go-winres, -H windowsgui, comlauncher)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build the app
        run: make release-windows VERSION="${BUILD_VERSION:-0.0.0-${GITHUB_SHA::7}}"

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: magpie-windows
          path: dist/magpie-windows-*.exe
          if-no-files-found: error

  linux:
    # пока выключено; включить — убрать if. Alma-вариант (контейнер
    # almalinux:10 + dnf golang git gtk3-devel webkit2gtk4.1-devel)
    # проверен руками на usbox-adm: та же make release-linux собирается
    # меньше чем за минуту
    if: false
    # GUI линкует GTK 3 и WebKitGTK 4.1 через cgo — нативно; arm64 не нужен
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # застрявшее apt-зеркало — известный режим отказа раннеров (см.
      # test.yml); ForceIPv4 закрывает DNS-сбой "Temporary failure resolving
      # archive.ubuntu.com", короткий таймаут шага делает фейл видимым
      - name: GTK 3 and WebKitGTK 4.1 headers
        timeout-minutes: 15
        run: |
          sudo apt-get -o Acquire::ForceIPv4 -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::ForceIPv4 -o Acquire::Retries=3 install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Build the app
        run: make release-linux VERSION="${BUILD_VERSION:-0.0.0-${GITHUB_SHA::7}}"

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: magpie-linux-amd64
          path: dist/magpie-linux-amd64
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [app, windows, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # все теги: решить, самый ли новый этот (--latest)

      - name: Gather the builds
        uses: actions/download-artifact@v4
        with:
          pattern: magpie-*
          path: dist
          merge-multiple: true

      - name: latest.json
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          python3 - "$TAG" "$REPO" << 'PY'
          import glob, hashlib, json, os, subprocess, sys
          tag, repo = sys.argv[1], sys.argv[2]
          version = tag[1:] if tag.startswith("v") else tag
          tags = subprocess.run(
              ["git", "tag", "--list", "v*", "--sort=-v:refname"],
              capture_output=True, text=True, check=True,
          ).stdout.split()
          prev = tags[1] if len(tags) > 1 else ""
          log = subprocess.run(
              ["git", "log", "--oneline", f"{prev}..{tag}" if prev else tag],
              capture_output=True, text=True, check=True,
          ).stdout.strip()
          notes = log or version
          assets = {}
          for path in sorted(glob.glob("dist/magpie-*")):
              name = os.path.basename(path)
              digest = hashlib.sha256(open(path, "rb").read()).hexdigest()
              assets[name] = {
                  "url": f"https://github.com/{repo}/releases/download/{tag}/{name}",
                  "size": os.path.getsize(path),
                  "sha256": digest,
              }
          feed = {
              "version": version,
              "notes": notes,
              "url": f"https://github.com/{repo}/releases/tag/{tag}",
              "assets": assets,
          }
          json.dump(feed, open("dist/latest.json", "w"), indent=2)
          open("dist/notes.md", "w").write(f"# {tag}\n\n{notes}\n")
          print("assets:", ", ".join(sorted(assets)))
          PY

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          HIGHEST=$(git tag --list 'v*' --sort=-v:refname | head -1)
          LATEST=()
          # только наивысший тег забирает метку Latest (адрес фида
          # releases/latest/download/... ведёт по ней)
          if [ "$HIGHEST" = "$TAG" ]; then LATEST+=(--latest); fi
          gh release create "$TAG" dist/magpie-* dist/latest.json \
            --title "$TAG" --notes-file dist/notes.md "${LATEST[@]}"
