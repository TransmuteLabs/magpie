name: Fork release

# Свой конвейер обновлений форка: пуш тега v* собирает macOS arm64-приложение,
# подписывает ad-hoc и публикует релиз с magpie-darwin-arm64.zip и latest.json.
# latest.json — фид самообновления приложения (internal/update: Feed, AppAsset,
# sameSigner): приложение с env
#   MAGPIE_UPDATE_FEED=https://github.com/TransmuteLabs/magpie/releases/latest/download/latest.json
# читает его, качает zip из того же релиза, сверяет SHA-256 и меняет себя.
# Установленное приложение должно быть сборкой этого же конвейера (первая
# установка вручную): sameSigner пускает только ту же подпись, ad-hoc -> ad-hoc.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label for the build (e.g. 0.1.4000); empty: 0.0.0-<sha>'
        required: false
        default: ''

permissions:
  contents: write

# версия сборки: из тега (v0.1.4000 -> 0.1.4000), из input ручного запуска
# или 0.0.0-<sha> для ручного без input
env:
  BUILD_VERSION: ${{ github.event.inputs.version || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}

jobs:
  app:
    # arm64-раннер: GUI линкует webview платформы нативно (cgo), кросс-сборки нет
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # все теги: решить, самый ли новый этот (--latest)

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build the app
        run: make app VERSION="${BUILD_VERSION:-0.0.0-${GITHUB_SHA::7}}"

      - name: Sign ad-hoc
        run: |
          codesign --force --deep -s - magpie.app
          codesign --verify --deep --strict magpie.app

      - name: Pack
        run: |
          mkdir -p dist
          ditto -c -k --keepParent magpie.app dist/magpie-darwin-arm64.zip
          ( cd dist && shasum -a 256 magpie-darwin-arm64.zip | awk '{print $1}' > magpie-darwin-arm64.zip.sha256 )

      - name: latest.json
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          python3 - "$TAG" "$REPO" << 'PY'
          import json, os, subprocess, sys
          tag, repo = sys.argv[1], sys.argv[2]
          version = tag[1:] if tag.startswith("v") else tag
          tags = subprocess.run(
              ["git", "tag", "--list", "v*", "--sort=-v:refname"],
              capture_output=True, text=True, check=True,
          ).stdout.split()
          prev = tags[1] if len(tags) > 1 else ""
          log = subprocess.run(
              ["git", "log", "--oneline", f"{prev}..{tag}" if prev else tag],
              capture_output=True, text=True, check=True,
          ).stdout.strip()
          notes = log or version
          sha = open("dist/magpie-darwin-arm64.zip.sha256").read().strip()
          feed = {
              "version": version,
              "notes": notes,
              "url": f"https://github.com/{repo}/releases/tag/{tag}",
              "assets": {
                  "magpie-darwin-arm64.zip": {
                      "url": f"https://github.com/{repo}/releases/download/{tag}/magpie-darwin-arm64.zip",
                      "size": os.path.getsize("dist/magpie-darwin-arm64.zip"),
                      "sha256": sha,
                  }
              },
          }
          json.dump(feed, open("dist/latest.json", "w"), indent=2)
          open("dist/notes.md", "w").write(f"# {tag}\n\n{notes}\n")
          PY

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: magpie-darwin-arm64
          path: dist/*
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          HIGHEST=$(git tag --list 'v*' --sort=-v:refname | head -1)
          LATEST=()
          # только наивысший тег забирает метку Latest (адрес фида
          # releases/latest/download/... ведёт по ней)
          if [ "$HIGHEST" = "$TAG" ]; then LATEST+=(--latest); fi
          gh release create "$TAG" dist/magpie-darwin-arm64.zip dist/latest.json \
            --title "$TAG" --notes-file dist/notes.md "${LATEST[@]}"
